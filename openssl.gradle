task prepareOpenSSLDirectories {
    mustRunAfter clean
    doLast {
        mkdir project.openssl_build_dir
        mkdir project.openssl_install
    }
}

// Runs the configure step.
def types = ["Debug", "Release"]
types.each { type ->
  // Create an alias to the build directory.
  def build_dir = file("$openssl_build_dir/${type.toLowerCase()}")
  project.tasks.create("configureOpenSSL$type", Exec) {
    mkdir build_dir

    // OpenSSL is configured with CMake. We want to build static libraries. Also set
    // the archive to be stored in build/lib instead of build/src (the default).
    executable "cmake"
    args "$openssl_dir", "-G", "Ninja", "-DCMAKE_BUILD_TYPE=$type", "-DBUILD_SHARED_LIBS=OFF"

    if (project.platform == "osx-arm64") {
      args "-DCMAKE_OSX_ARCHITECTURES=arm64", "-DCMAKE_OSX_DEPLOYMENT_TARGET=\"11.0\""
      environment "ARCHFLAGS", "-arch arm64"
    } else if (project.platform == "osx-x86_64") {
      args "-DCMAKE_OSX_ARCHITECTURES=x86_64", "-DCMAKE_OSX_DEPLOYMENT_TARGET=\"11.0\""
      environment "ARCHFLAGS", "-arch x86_64"
    } else if (project.platform == "linux-arm64") {
      if (project.hasProperty('forcecrossbuild')) {
        args "-DCMAKE_TOOLCHAIN_FILE=/usr/local/toolchain-config.cmake"
      }
    } else if (project.platform == "windows-arm64") {
      args "-DOPENSSL_NO_ASM=ON"
    }
    args "-DDISABLE_GO=ON", "-DDISABLE_PERL=ON", "-DBUILD_TOOL=OFF", "-DBUILD_LIBSSL=OFF",
         "-DBUILD_TESTING=OFF","-DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=${build_dir}/lib"
    workingDir build_dir
  }
  // Runs the build step.
  project.tasks.create("buildOpenSSL$type", Exec) {
    // Make sure that we are configured.
    dependsOn "configureOpenSSL$type"

    // Use CMake to invoke the low-level build system.
    executable "cmake"
    args "--build", ".", "--parallel", "${project.processors}"
    workingDir build_dir
  }
  project.tasks.create("installOpenSSL$type", Exec) {
    dependsOn "buildOpenSSL$type"
    executable "cmake"
    args "--install", "$build_dir", "--prefix", "$project.openssl_install/${type.toLowerCase()}"
  }
}

// Create a "mega-task" that builds everything.
project.tasks.create("openSSL") {
  types.each { type ->
    dependsOn "installOpenSSL$type"
    outputs.dir("$project.openssl_install/${type.toLowerCase()}")
  }
}
